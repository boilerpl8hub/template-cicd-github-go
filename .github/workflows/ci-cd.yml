name: CI/CD

on:
  pull_request:
    branches: [main, develop]
  push:
    branches:
      - 'ops/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy target'
        required: true
        default: 'staging'
        type: choice
        options:
          - 'staging'
          - 'prod'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ${{ secrets.REGISTRY }}
  IMAGE: ${{ secrets.BACKEND_REGISTRY_IMAGE }}

jobs:
  placeholder:
    runs-on: ubuntu-latest
    steps:
      - run: echo "placeholder — remove after adding real jobs"
