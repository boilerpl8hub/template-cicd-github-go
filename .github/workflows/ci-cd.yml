name: CI/CD

on:
  pull_request:
    branches: [main, develop]
  push:
    branches:
      - 'ops/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy target'
        required: true
        default: 'staging'
        type: choice
        options:
          - 'staging'
          - 'prod'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ${{ secrets.REGISTRY }}
  IMAGE: ${{ secrets.BACKEND_REGISTRY_IMAGE }}

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.22', '1.23']
    env:
      GOPROXY: ${{ vars.GOPROXY || 'https://proxy.golang.org,direct' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install Wire
        continue-on-error: true
        run: GOPROXY=$GOPROXY go install github.com/google/wire/cmd/wire@latest
        # Remove this step if the project does not use google/wire

      - name: Download dependencies
        run: GOPROXY=$GOPROXY go mod download

      - name: Generate Wire
        continue-on-error: true
        run: '[ -d wire ] && (cd wire && wire) || echo "No wire/ directory, skipping"'
        # Remove this step if the project does not use google/wire

      - name: Test
        id: run-tests
        continue-on-error: true
        run: go test -race -count=1 ./... 2>&1 | tee /tmp/test-output.txt

      - name: Install gosec
        continue-on-error: true
        run: GOPROXY=$GOPROXY go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        id: run-gosec
        continue-on-error: true
        run: gosec ./... 2>&1 | tee /tmp/gosec-output.txt

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const testOut = fs.existsSync('/tmp/test-output.txt')
              ? fs.readFileSync('/tmp/test-output.txt', 'utf8').slice(0, 30000)
              : 'No output';
            const gosecOut = fs.existsSync('/tmp/gosec-output.txt')
              ? fs.readFileSync('/tmp/gosec-output.txt', 'utf8').slice(0, 10000)
              : 'No output';
            const testStatus = '${{ steps.run-tests.outcome }}' === 'success' ? '✅' : '❌';
            const gosecStatus = '${{ steps.run-gosec.outcome }}' === 'success' ? '✅' : '⚠️';
            const marker = `<!-- ci-results-go-${{ matrix.go-version }} -->`;
            const body = [
              marker,
              `## CI Results — Go \`${{ matrix.go-version }}\``,
              `| Check | Status |`,
              `|---|---|`,
              `| Tests (-race) | ${testStatus} |`,
              `| gosec (advisory) | ${gosecStatus} |`,
              ``,
              `<details><summary>Test output</summary>\n\n\`\`\`\n${testOut}\n\`\`\`\n</details>`,
              `<details><summary>gosec output (advisory only)</summary>\n\n\`\`\`\n${gosecOut}\n\`\`\`\n</details>`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            }

      - name: Fail if tests failed
        if: steps.run-tests.outcome == 'failure'
        run: exit 1

  build-push:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ops/')) ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to custom registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-push]
    if: |
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.STAGING_SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Save current image tag for rollback
        run: |
          PREV=$(ssh -i ~/.ssh/id_rsa \
            ${{ secrets.STAGING_SERVER_USER }}@${{ secrets.STAGING_SERVER_HOST }} \
            "cat ${{ secrets.STAGING_SERVER_DIR }}/.current_tag 2>/dev/null || echo none")
          echo "PREVIOUS_TAG=$PREV" >> $GITHUB_ENV

      - name: Copy docker-compose to server
        run: |
          ssh -i ~/.ssh/id_rsa \
            ${{ secrets.STAGING_SERVER_USER }}@${{ secrets.STAGING_SERVER_HOST }} \
            "mkdir -p ${{ secrets.STAGING_SERVER_DIR }}"
          scp -i ~/.ssh/id_rsa docker-compose.yml \
            ${{ secrets.STAGING_SERVER_USER }}@${{ secrets.STAGING_SERVER_HOST }}:${{ secrets.STAGING_SERVER_DIR }}/

      # SECURITY NOTE: Secrets are expanded by GitHub Actions before being sent via SSH.
      # Avoid enabling ACTIONS_STEP_DEBUG=true in production — it logs expanded secret values.
      - name: Deploy
        id: deploy
        run: |
          ssh -i ~/.ssh/id_rsa \
            ${{ secrets.STAGING_SERVER_USER }}@${{ secrets.STAGING_SERVER_HOST }} "
            set -e
            cd ${{ secrets.STAGING_SERVER_DIR }}
            echo '${{ secrets.REGISTRY_PASSWORD }}' | docker login ${{ env.REGISTRY }} \
              -u ${{ secrets.REGISTRY_USERNAME }} --password-stdin
            echo '${{ secrets.STAGING_BACKEND_ENV }}' > .env
            mkdir -p keys
            echo '${{ secrets.JWT_PRIVATE_KEY }}' > keys/private.pem
            echo '${{ secrets.JWT_PUBLIC_KEY }}' > keys/public.pem
            chmod 600 keys/private.pem keys/public.pem
            export BACKEND_REGISTRY_IMAGE=${{ env.IMAGE }}:${{ github.sha }}
            docker compose pull
            docker compose run --rm migrate || true
            docker compose down --remove-orphans
            docker compose up -d
            echo '${{ github.sha }}' > .current_tag
            docker image prune -f
          "
          # Remove JWT key steps above if project does not use RS256 JWT

      - name: Health check
        id: health
        run: |
          for i in $(seq 1 5); do
            if ssh -i ~/.ssh/id_rsa \
              ${{ secrets.STAGING_SERVER_USER }}@${{ secrets.STAGING_SERVER_HOST }} \
              "curl -sf http://localhost:${{ vars.HEALTH_PORT }}/health"; then
              echo "Health check passed on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, waiting 3s..."
            sleep 3
          done
          echo "Health check failed after 5 attempts"
          exit 1

      - name: Rollback on health check failure
        if: failure() && steps.health.outcome == 'failure' && env.PREVIOUS_TAG != 'none'
        run: |
          echo "Rolling back to ${{ env.PREVIOUS_TAG }}"
          ssh -i ~/.ssh/id_rsa \
            ${{ secrets.STAGING_SERVER_USER }}@${{ secrets.STAGING_SERVER_HOST }} "
            set -e
            cd ${{ secrets.STAGING_SERVER_DIR }}
            export BACKEND_REGISTRY_IMAGE=${{ env.IMAGE }}:${{ env.PREVIOUS_TAG }}
            docker compose pull
            docker compose down --remove-orphans
            docker compose up -d
            echo '${{ env.PREVIOUS_TAG }}' > .current_tag
            echo 'Rolled back to ${{ env.PREVIOUS_TAG }}'
          "

      - name: Notify success
        if: success()
        run: |
          MSG="✅ Staging deploy succeeded%0ARepo: ${{ github.repository }}%0ABranch: ${{ github.ref_name }}%0ASHA: ${{ github.sha }}"
          curl -sf -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=${MSG}" || true
          curl -sf -X POST "https://tapi.bale.ai/bot${{ secrets.BALE_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.BALE_CHAT_ID }}&text=${MSG}" || true

      - name: Notify failure
        if: failure()
        run: |
          MSG="❌ Staging deploy FAILED%0ARepo: ${{ github.repository }}%0ABranch: ${{ github.ref_name }}%0ASHA: ${{ github.sha }}"
          curl -sf -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=${MSG}" || true
          curl -sf -X POST "https://tapi.bale.ai/bot${{ secrets.BALE_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.BALE_CHAT_ID }}&text=${MSG}" || true

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-push]
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ops/')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Save current image tag for rollback
        run: |
          PREV=$(ssh -i ~/.ssh/id_rsa \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cat ${{ secrets.SERVER_DIR }}/.current_tag 2>/dev/null || echo none")
          echo "PREVIOUS_TAG=$PREV" >> $GITHUB_ENV

      - name: Copy docker-compose to server
        run: |
          ssh -i ~/.ssh/id_rsa \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "mkdir -p ${{ secrets.SERVER_DIR }}"
          scp -i ~/.ssh/id_rsa docker-compose.yml \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_DIR }}/

      # SECURITY NOTE: Secrets are expanded by GitHub Actions before being sent via SSH.
      # Avoid enabling ACTIONS_STEP_DEBUG=true in production — it logs expanded secret values.
      - name: Deploy
        id: deploy
        run: |
          ssh -i ~/.ssh/id_rsa \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            set -e
            cd ${{ secrets.SERVER_DIR }}
            echo '${{ secrets.REGISTRY_PASSWORD }}' | docker login ${{ env.REGISTRY }} \
              -u ${{ secrets.REGISTRY_USERNAME }} --password-stdin
            echo '${{ secrets.BACKEND_ENV }}' > .env
            mkdir -p keys
            echo '${{ secrets.JWT_PRIVATE_KEY }}' > keys/private.pem
            echo '${{ secrets.JWT_PUBLIC_KEY }}' > keys/public.pem
            chmod 600 keys/private.pem keys/public.pem
            export BACKEND_REGISTRY_IMAGE=${{ env.IMAGE }}:${{ github.sha }}
            docker compose pull
            docker compose run --rm migrate || true
            docker compose down --remove-orphans
            docker compose up -d
            echo '${{ github.sha }}' > .current_tag
            docker image prune -f
          "
          # Remove JWT key steps above if project does not use RS256 JWT

      - name: Health check
        id: health
        run: |
          for i in $(seq 1 5); do
            if ssh -i ~/.ssh/id_rsa \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
              "curl -sf http://localhost:${{ vars.HEALTH_PORT }}/health"; then
              echo "Health check passed on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, waiting 3s..."
            sleep 3
          done
          echo "Health check failed after 5 attempts"
          exit 1

      - name: Rollback on health check failure
        if: failure() && steps.health.outcome == 'failure' && env.PREVIOUS_TAG != 'none'
        run: |
          echo "Rolling back to ${{ env.PREVIOUS_TAG }}"
          ssh -i ~/.ssh/id_rsa \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            set -e
            cd ${{ secrets.SERVER_DIR }}
            export BACKEND_REGISTRY_IMAGE=${{ env.IMAGE }}:${{ env.PREVIOUS_TAG }}
            docker compose pull
            docker compose down --remove-orphans
            docker compose up -d
            echo '${{ env.PREVIOUS_TAG }}' > .current_tag
            echo 'Rolled back to ${{ env.PREVIOUS_TAG }}'
          "

      - name: Notify success
        if: success()
        run: |
          MSG="✅ Production deploy succeeded%0ARepo: ${{ github.repository }}%0ABranch: ${{ github.ref_name }}%0ASHA: ${{ github.sha }}"
          curl -sf -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=${MSG}" || true
          curl -sf -X POST "https://tapi.bale.ai/bot${{ secrets.BALE_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.BALE_CHAT_ID }}&text=${MSG}" || true

      - name: Notify failure
        if: failure()
        run: |
          MSG="❌ Production deploy FAILED%0ARepo: ${{ github.repository }}%0ABranch: ${{ github.ref_name }}%0ASHA: ${{ github.sha }}"
          curl -sf -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=${MSG}" || true
          curl -sf -X POST "https://tapi.bale.ai/bot${{ secrets.BALE_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.BALE_CHAT_ID }}&text=${MSG}" || true
